services:
  postgres-db:
    image: postgres:15-alpine
    restart: always
    expose:
      - 5432
    ports:
      - 5433:5432
    environment:
      - POSTGRES_DB=praise-app-db
      - POSTGRES_USER=praiseapp
      - POSTGRES_PASSWORD=praise
    volumes:
      - praiseapp-postgresql-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  praiseapp-postgresql-data: